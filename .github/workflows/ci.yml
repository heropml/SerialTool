name: CI

on:
  push:
    branches: [CommTool, main, master]
  pull_request:
  schedule:
    # Nightly soak (UTC). Default push/PR job stays soak-free.
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      run_soak:
        description: "Also run extended soak / disconnect churn"
        type: boolean
        default: false

# 同分支连推时取消旧 run，避免 Windows pytest 偶发卡死占满排队、黄点挂很久。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-pytest:
    name: Windows + offscreen pytest
    runs-on: windows-latest
    # Isolated PyQt test processes trade startup time for deterministic teardown.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints-runtime.txt

      - name: Ruff (critical rules only)
        run: python -m ruff check --config ruff.toml src tests scripts

      - name: Run test files in isolated processes + coverage
        env:
          QT_QPA_PLATFORM: offscreen
          # Do not set PYTHONFAULTHANDLER here: on Windows an intermittent
          # PyQt/serial access violation then aborts the whole pytest process
          # (exit 1 in ~30s) instead of isolating the flaky test.
        run: |
          Get-ChildItem tests -File -Filter "test_*.py" | ForEach-Object {
            $testFile = $_.FullName
            $attempt = 0
            do {
              $attempt++
              Write-Host "::group::pytest $testFile (attempt $attempt)"
              python -m pytest $testFile `
                --timeout=120 `
                --timeout-method=thread `
                --junitxml="pytest-results-$($_.BaseName).xml" `
                --cov=src `
                --cov-append `
                --cov-report=
              $exitCode = $LASTEXITCODE
              Write-Host "::endgroup::"
              # 0xC0000005 is a native access violation sometimes raised by
              # PyQt during process teardown after an otherwise passing file.
              if ($exitCode -eq -1073741819 -and $attempt -lt 2) {
                Write-Warning "pytest access violation for $testFile; retrying once"
                continue
              }
              break
            } while ($true)
            if ($exitCode -ne 0) {
              Write-Error "pytest failed for $testFile (exit $exitCode)"
              exit $exitCode
            }
          }
          python -m coverage xml -o coverage.xml
          python -m coverage report --skip-covered

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-windows
          path: |
            pytest-results-*.xml
            coverage.xml
            .coverage

  macos-smoke:
    name: macOS smoke (offscreen subset)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints-runtime.txt
          pip install pytest pytest-timeout

      - name: Smoke suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m pytest
          tests/test_i18n_parity.py
          tests/test_split_persist.py
          tests/test_silent_except_budget.py
          tests/test_session_host.py
          tests/test_updater_mac.py
          tests/test_multi_session.py
          -q --tb=short
          --timeout=120
          --timeout-method=thread
          --junitxml=pytest-results-macos.xml

      - name: Upload macOS smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-macos
          path: pytest-results-macos.xml

  linux-smoke:
    name: Linux smoke (offscreen subset)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt offscreen runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints-runtime.txt
          pip install pytest pytest-timeout

      - name: Smoke suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m pytest
          tests/test_i18n_parity.py
          tests/test_split_persist.py
          tests/test_silent_except_budget.py
          tests/test_session_host.py
          tests/test_updater_mac.py
          tests/test_updater_linux.py
          tests/test_multi_session.py
          -q --tb=short
          --timeout=120
          --timeout-method=thread
          --junitxml=pytest-results-linux.xml

      - name: Upload Linux smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-linux
          path: pytest-results-linux.xml

  windows-soak-nightly:
    name: Nightly soak / disconnect churn
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.run_soak == true)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints-runtime.txt

      - name: Extended soak
        env:
          QT_QPA_PLATFORM: offscreen
          COMMTOOL_SOAK: "30"
          COMMTOOL_SOAK_DISCONNECT: "1"
        run: python -m pytest tests/test_multi_session.py tests/test_soak_throughput.py

  python-compat:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported source minimum; 3.13 is the release target.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Qt offscreen runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libglib2.0-0

      - name: Install pinned runtime and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints-runtime.txt
          pip install pytest pytest-timeout

      - name: Compile and compatibility tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q src tests
          python -m pytest \
            tests/test_diagnostics.py \
            tests/test_trigger_safe.py \
            tests/test_s2_r46_auto_reply_gate.py \
            tests/test_updater_win.py \
            tests/test_product_resources.py \
            tests/test_project_model.py \
            tests/test_rec_replay.py \
            tests/test_update_manifest_integrity.py \
            -q --tb=short --timeout=120
