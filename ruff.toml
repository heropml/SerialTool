# 零门槛起步：只拦明确错误（语法 / 未定义名等），不强制风格大扫除。
# 与 README / CI 声明的最低 Python 3.11 一致，让 Ruff 按真实运行时
# 基线解析语法并拦截误用更高版本才支持的特性。
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[lint]
select = [
  "E9",   # runtime syntax errors
  "F63",  # invalid print/assert syntax
  "F7",   # __future__ annotation issues
  "F82",  # undefined names
]
